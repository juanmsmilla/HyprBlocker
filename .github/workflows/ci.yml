name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run ruff
        run: uvx ruff check daemon desktop-app/main.py desktop-app/api_client.py tray tests

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install
      # The full project depends on GTK system libraries (pygobject, pywebview[gtk])
      # that aren't needed for the unit tests, so run without syncing the project.
      # `pythonpath = ["."]` in pyproject.toml makes `import daemon` work anyway.
      - name: Run tests with coverage
        run: >
          uv run --no-project
          --with pytest --with pytest-cov
          --with sqlalchemy --with aiosqlite
          --with fastapi --with httpx --with ntplib
          pytest -q --cov=daemon --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  extension:
    name: Extension tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run matcher tests
        run: bun test extension

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
