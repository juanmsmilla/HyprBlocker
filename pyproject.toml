[project]
name = "website-blocker"
version = "0.1.0"
description = "A self-control website & app blocker for Linux/Hyprland with a tamper-resistant daemon, browser extension, and lockable schedules"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.127.0",
    "ntplib>=0.4.0",
    "pillow>=12.1.0",
    "pygobject>=3.50.0",
    "pyinstaller>=6.17.0",
    "pystray>=0.19.5",
    "pywebview[gtk]>=6.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "dist", "desktop-app/web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E402",  # module import not at top of file (daemon uses sys.path setup before imports)
    "E501",  # line length handled by formatter where it matters
    "B008",  # function call in default argument (idiomatic FastAPI Depends())
]
